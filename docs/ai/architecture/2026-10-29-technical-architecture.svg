<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 1110" width="1520" height="1110" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <style>
      .t{font-size:15px;font-weight:700;fill:#0f172a}
      .h{font-size:13px;font-weight:700;fill:#0f172a}
      .s{font-size:11.5px;fill:#334155}
      .m{font-size:10.5px;fill:#64748b}
      .n{font-size:10px;font-weight:700;fill:#b45309}
      .box{fill:#ffffff;stroke:#94a3b8;stroke-width:1.2}
      .new{fill:#fffbeb;stroke:#d97706;stroke-width:1.6;stroke-dasharray:5 3}
      .grp{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}
      .ln{stroke:#475569;stroke-width:1.3;fill:none}
      .lb{stroke:#2563eb;stroke-width:1.6;fill:none}
      .step{font-size:11px;font-weight:700;fill:#ffffff}
    </style>
  </defs>
  <rect width="1520" height="1110" fill="#ffffff"/>

  <text x="24" y="34" font-size="20" font-weight="800" fill="#0f172a">OpenSlate 技术架构（v8 · tool contract 7.0.0）</text>
  <text x="24" y="56" class="m">全部跑在本机 127.0.0.1，只有模型调用出网。虚线橙框 = 这一轮新增或改动的部分；实线 = 之前就有。蓝色编号 = 一次 Director turn（agent loop）的路径。</text>

  <!-- Browser -->
  <rect x="20" y="74" width="1480" height="118" rx="10" class="grp"/>
  <text x="34" y="96" class="t">Browser · apps/web（React 19 + Vite，Last Ferry UI）</text>
  <rect x="34" y="106" width="250" height="74" rx="8" class="box"/>
  <text x="46" y="126" class="h">Director 聊天列</text>
  <text x="46" y="143" class="s">进度行 · Needs attention</text>
  <text x="46" y="159" class="s">笔记 / proposal 卡片</text>
  <rect x="294" y="106" width="300" height="74" rx="8" class="new"/>
  <text x="306" y="126" class="h">新卡片</text>
  <text x="306" y="143" class="s">风格卡 · 确认卡（删除 / 用旧 take / 继续）</text>
  <text x="306" y="159" class="s">Give up · 丢弃 · 不再等待 · 重新渲染</text>
  <rect x="604" y="106" width="330" height="74" rx="8" class="box"/>
  <text x="616" y="126" class="h">Plan · Keyframes · Assets · Film · Settings</text>
  <text x="616" y="143" class="s">injected store + pure reducer · 中英文 i18n</text>
  <text x="616" y="159" class="s">样例影片 fixture（浏览器场景 205 个）</text>
  <rect x="944" y="106" width="544" height="74" rx="8" class="new"/>
  <text x="956" y="126" class="h">新界面</text>
  <text x="956" y="143" class="s">Plan › Look / Cast / 服装表 · 设定图审阅 · 唱歌开关 · 分析歌曲</text>
  <text x="956" y="159" class="s">Film › 比例 · 保留片段原声 · 贴合歌曲 · Settings › fal / Gemini key</text>

  <!-- arrows browser <-> server -->
  <line x1="420" y1="192" x2="420" y2="236" class="ln" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="428" y="219" class="m">HTTP 命令 + SSE 事件</text>

  <!-- Server -->
  <rect x="20" y="238" width="1010" height="600" rx="10" class="grp"/>
  <text x="34" y="260" class="t">Server · apps/server（Fastify，127.0.0.1:3001）</text>

  <rect x="34" y="272" width="300" height="88" rx="8" class="box"/>
  <text x="46" y="292" class="h">HTTP API + SSE</text>
  <text x="46" y="309" class="s">Host/Origin 校验 · freshness · 幂等</text>
  <text x="46" y="325" class="s">ProjectEventStream（认证 SSE + resync）</text>
  <text x="46" y="341" class="m">人的按钮和 Director 的 tool 走同一套命令</text>

  <rect x="344" y="272" width="330" height="88" rx="8" class="box"/>
  <text x="356" y="292" class="h">Application services</text>
  <text x="356" y="309" class="s">storyboard 命令（含 Undo）· proposals · notes</text>
  <text x="356" y="325" class="s">generation overview · takes · 场景确认 runner</text>
  <text x="356" y="341" class="s">narration-fit · exports · 报价 quotes</text>

  <rect x="684" y="272" width="332" height="88" rx="8" class="new"/>
  <text x="696" y="292" class="h">新服务</text>
  <text x="696" y="309" class="s">characters 路由 + 设定图 generate/import/approve</text>
  <text x="696" y="325" class="s">MusicAnalyzer：本地 timing + Gemini enrichment</text>
  <text x="696" y="341" class="s">默认配乐 · 贴合歌曲 shotTiming · filmKind intake</text>

  <!-- Director supervisor + skill loader + tool invocations -->
  <rect x="34" y="372" width="300" height="100" rx="8" class="box"/>
  <text x="46" y="392" class="h">Director supervisor</text>
  <text x="46" y="409" class="s">每个项目一次一个 turn · lease · epoch</text>
  <text x="46" y="425" class="s">请求范围 / hold / 授权（grant）</text>
  <text x="46" y="441" class="s">自动审图 turn 的触发</text>
  <text x="46" y="460" class="m">agent harness 的"外壳"：决定何时、带什么上下文跑</text>

  <rect x="344" y="372" width="330" height="100" rx="8" class="new"/>
  <text x="356" y="392" class="h">Skill loader（v8 release）</text>
  <text x="356" y="409" class="s">routeSkills(filmKind) → 选包；lock v2 · activation v2</text>
  <text x="356" y="425" class="s">只放各包 SKILL.md + 2 个核心 reference</text>
  <text x="356" y="441" class="s">其余经 read_guidance 按需读取并记录</text>
  <text x="356" y="460" class="m">v1–v7 锁照旧校验，旧项目不变</text>

  <rect x="684" y="372" width="332" height="100" rx="8" class="new"/>
  <text x="696" y="392" class="h">Tool invocations（contract 7.0.0）</text>
  <text x="696" y="409" class="s">scope / authority / 回执对账（lost receipt）</text>
  <text x="696" y="425" class="s">免费：set_soundtrack · move · undo · export …</text>
  <text x="696" y="441" class="s">确认卡：delete · use_take · resume</text>
  <text x="696" y="460" class="m">6.0.0 目录不动，旧回执照样对账</text>

  <!-- compiler, engine, media -->
  <rect x="34" y="484" width="300" height="96" rx="8" class="box"/>
  <text x="46" y="504" class="h">Plan compiler</text>
  <text x="46" y="521" class="s">Babel AST 白名单 → operation graph</text>
  <text x="46" y="537" class="s">worker_threads 隔离 · 场景编排</text>
  <text x="46" y="553" class="s">ajv 校验 schema</text>

  <rect x="344" y="484" width="330" height="96" rx="8" class="box"/>
  <text x="356" y="504" class="h">Execution engine</text>
  <text x="356" y="521" class="s">admission · attempts · leases · 回执</text>
  <text x="356" y="537" class="s">unknown outcome 对账 · Give up · 不重复提交</text>
  <text x="356" y="553" class="n">新：失败原因枚举 · 丢弃 · 脱离等待 · 重渲染</text>
  <text x="356" y="569" class="n">新：设定图节点（不属于任何镜头）</text>

  <rect x="684" y="484" width="332" height="96" rx="8" class="box"/>
  <text x="696" y="504" class="h">Media 层（ffmpeg 本地渲染）</text>
  <text x="696" y="521" class="s">spool · probe/normalize · 文档抽取（pdfjs）</text>
  <text x="696" y="537" class="n">新：按比例导出 720×1280 / 1280×720 / 720×720</text>
  <text x="696" y="553" class="n">新：片段原声混音 + 旁白下压低 12 dB</text>
  <text x="696" y="569" class="n">新：歌曲 tempo / beats / sections 分析</text>

  <!-- providers -->
  <rect x="34" y="592" width="982" height="108" rx="8" class="box"/>
  <text x="46" y="612" class="h">Provider adapters · packages/providers（每个都有 dispatch → mapping → observation → receipt，丢失的提交永不重提）</text>
  <rect x="46" y="622" width="150" height="66" rx="6" class="box"/>
  <text x="56" y="640" class="h">codex-image</text>
  <text x="56" y="656" class="s">keyframe / 设定图</text>
  <text x="56" y="672" class="n">新 transport v2（竖/横）</text>
  <rect x="206" y="622" width="150" height="66" rx="6" class="box"/>
  <text x="216" y="640" class="h">viggle-h3</text>
  <text x="216" y="656" class="s">图生视频 · 3–15 s</text>
  <text x="216" y="672" class="n">新：aspect_ratio</text>
  <rect x="366" y="622" width="150" height="66" rx="6" class="box"/>
  <text x="376" y="640" class="h">minimax-h3</text>
  <text x="376" y="656" class="s">直连 MiniMax 备选</text>
  <rect x="526" y="622" width="150" height="66" rx="6" class="new"/>
  <text x="536" y="640" class="h">fal-h3-lipsync</text>
  <text x="536" y="656" class="s">唱歌镜头对口型</text>
  <text x="536" y="672" class="s">$0.08/s @768p</text>
  <rect x="686" y="622" width="150" height="66" rx="6" class="new"/>
  <text x="696" y="640" class="h">gemini-audio</text>
  <text x="696" y="656" class="s">歌曲段落 / 歌词 / 情绪</text>
  <text x="696" y="672" class="s">约 $0.02 / 3 分钟</text>
  <rect x="846" y="622" width="160" height="66" rx="6" class="box"/>
  <text x="856" y="640" class="h">openai-*</text>
  <text x="856" y="656" class="s">image · speech（TTS）</text>
  <text x="856" y="672" class="s">transcription</text>

  <!-- storage -->
  <rect x="34" y="712" width="480" height="112" rx="8" class="box"/>
  <text x="46" y="732" class="h">SQLite（better-sqlite3，WAL）</text>
  <text x="46" y="749" class="s">entities(kind,id,body JSON)：project_revision · attempt · receipt</text>
  <text x="46" y="765" class="s">director_turn · tool_invocation · skill_read · director_skill_lock</text>
  <text x="46" y="781" class="s">director_note · proposal · hold · grant · media_render · events</text>
  <text x="46" y="801" class="m">影片状态归应用，不归对话：LLM 只提议，应用校验、编译、执行、恢复</text>
  <rect x="524" y="712" width="492" height="112" rx="8" class="box"/>
  <text x="536" y="732" class="h">Owned artifacts（内容哈希）</text>
  <text x="536" y="749" class="s">media/blobs：keyframe PNG · 去掉音轨的 clip MP4</text>
  <text x="536" y="765" class="n">新：保留带音轨的 .source 原片，用于片段原声</text>
  <text x="536" y="781" class="s">execution-output spool · 导出 MP4 · 音乐库</text>
  <text x="536" y="801" class="m">数据目录：OPENSLATE_DATA_DIR（每个测试用新目录）</text>

  <!-- Director process / agent harness -->
  <rect x="1046" y="238" width="454" height="404" rx="10" class="grp"/>
  <text x="1060" y="260" class="t">Director 子进程 · packages/director（agent harness）</text>

  <rect x="1060" y="272" width="426" height="118" rx="8" class="box"/>
  <text x="1072" y="292" class="h">Codex app-server 0.153.4（agent loop）</text>
  <text x="1072" y="309" class="s">JSON-RPC over stdio：initialize → thread/start → turn/start</text>
  <text x="1072" y="325" class="s">模型推理 → 调 MCP tool → 读结果 → 继续，直到 turn 结束</text>
  <text x="1072" y="341" class="s">私有 Codex home（只链接 auth.json，不继承你的 MCP / 配置）</text>
  <text x="1072" y="357" class="s">sandbox read-only · approvals never · strict config</text>
  <text x="1072" y="376" class="m">模型：gpt-6-astra（ChatGPT 账号，Codex 订阅计费 $0）</text>

  <rect x="1060" y="400" width="426" height="74" rx="8" class="new"/>
  <text x="1072" y="420" class="h">Codex skills（只启用路由选中的包）</text>
  <text x="1072" y="437" class="s">skills/v8：2 核心 + 10 craft + 9 type + 1 format</text>
  <text x="1072" y="453" class="s">v7 及更早的包不可变，只为旧锁保留</text>

  <rect x="1060" y="484" width="426" height="74" rx="8" class="box"/>
  <text x="1072" y="504" class="h">OpenSlate MCP bridge（stdio）</text>
  <text x="1072" y="521" class="s">把 tool catalog 暴露给 Codex；启动时固定 endpoint +</text>
  <text x="1072" y="537" class="s">projectId + epoch 凭证，参数不能改变权限</text>

  <rect x="1060" y="568" width="426" height="62" rx="8" class="box"/>
  <text x="1072" y="588" class="h">Codex image worker（独立 app-server 进程）</text>
  <text x="1072" y="605" class="s">同一个私有 home · 禁用 MCP · 校验 binary / 配置 digest</text>
  <text x="1072" y="620" class="m">生成的 PNG 从 generated_images 取回</text>

  <!-- cloud vendors -->
  <rect x="1046" y="656" width="454" height="268" rx="10" class="grp"/>
  <text x="1060" y="678" class="t">云端 vendor（只有这里出网）</text>
  <rect x="1060" y="690" width="426" height="44" rx="6" class="box"/>
  <text x="1072" y="708" class="h">OpenAI · ChatGPT 账号（经本地 Codex）</text>
  <text x="1072" y="725" class="s">gpt-6-astra = Director · Codex imagegen = 关键帧（$0）</text>
  <rect x="1060" y="740" width="426" height="44" rx="6" class="box"/>
  <text x="1072" y="758" class="h">Viggle API → MiniMax H3</text>
  <text x="1072" y="775" class="s">图生视频，约 $0.01/秒；自带原声</text>
  <rect x="1060" y="790" width="426" height="44" rx="6" class="new"/>
  <text x="1072" y="808" class="h">fal → MiniMax H3 Max lip-sync</text>
  <text x="1072" y="825" class="s">关键帧 + 歌曲片段 → 对口型片段（OPENSLATE_FAL_API_KEY）</text>
  <rect x="1060" y="840" width="426" height="38" rx="6" class="new"/>
  <text x="1072" y="857" class="h">Google Gemini 3.8 Flash（OPENSLATE_GEMINI_API_KEY）</text>
  <text x="1072" y="872" class="s">歌曲理解；Astra 实测听不到音频，所以用 Gemini</text>
  <rect x="1060" y="884" width="426" height="32" rx="6" class="box"/>
  <text x="1072" y="905" class="s"><tspan class="h">OpenAI API</tspan>：图片备选 · TTS 配音 · 录音转写</text>

  <!-- connections -->
  <path d="M334 422 H344" class="ln"/>
  <path d="M674 422 H684" class="ln"/>
  <!-- supervisor -> codex -->
  <path d="M180 372 V366 H1036 V331 H1060" class="lb" marker-end="url(#ab)"/>
  <circle cx="560" cy="366" r="9" fill="#2563eb"/><text x="556" y="370" class="step">1</text>
  <!-- codex <-> skills -->
  <path d="M1273 390 V400" class="lb" marker-end="url(#ab)"/>
  <circle cx="1290" cy="395" r="9" fill="#2563eb"/><text x="1286" y="399" class="step">2</text>
  <!-- codex -> mcp bridge -->
  <path d="M1462 390 V484" class="lb" marker-end="url(#ab)"/>
  <circle cx="1475" cy="440" r="9" fill="#2563eb"/><text x="1471" y="444" class="step">3</text>
  <!-- bridge -> tool invocations -->
  <path d="M1060 521 H1030 V430 H1016" class="lb" marker-end="url(#ab)"/>
  <circle cx="1036" cy="478" r="9" fill="#2563eb"/><text x="1032" y="482" class="step">4</text>
  <!-- tool invocations -> app services -->
  <path d="M760 372 V360" class="lb" marker-end="url(#ab)"/>
  <circle cx="744" cy="366" r="9" fill="#2563eb"/><text x="740" y="370" class="step">5</text>
  <!-- engine -> providers -->
  <path d="M509 580 V592" class="ln" marker-end="url(#a)"/>
  <!-- providers -> cloud -->
  <path d="M1016 655 H1036 V712 H1060" class="ln" marker-end="url(#a)"/>
  <!-- image worker -> openai -->
  <path d="M1486 600 H1496 V712 H1486" class="ln" marker-end="url(#a)"/>
  <!-- events back -->
  <path d="M600 272 V194" class="lb" marker-end="url(#ab)"/>
  <circle cx="616" cy="252" r="9" fill="#2563eb"/><text x="612" y="256" class="step">6</text>

  <!-- legend / loop explanation -->
  <rect x="20" y="852" width="1010" height="246" rx="10" class="grp"/>
  <text x="34" y="876" class="t">一次 Director turn 怎么跑（对应蓝色编号）</text>
  <text x="34" y="900" class="s"><tspan class="h">1</tspan>  Supervisor 收到你的消息，按项目的 filmKind 路由技能包、写 lock，然后给 Codex 启动一个 turn（带范围、hold、epoch 凭证）。</text>
  <text x="34" y="922" class="s"><tspan class="h">2</tspan>  Codex 只看到选中包的 SKILL.md；需要细节时调 read_guidance 读 reference（每次读取都记成 skill_read）。</text>
  <text x="34" y="944" class="s"><tspan class="h">3</tspan>  模型决定调用哪个 tool（read_context、prepare_change、make_keyframes、propose_visual_style …），通过 MCP stdio 发给 bridge。</text>
  <text x="34" y="966" class="s"><tspan class="h">4</tspan>  Bridge 用固定凭证打本机 loopback HTTP；tool invocations 校验范围、权限和同意等级，写 tool_invocation 回执。</text>
  <text x="34" y="988" class="s"><tspan class="h">5</tspan>  真正的修改走和人按钮相同的 application 命令；付费的事只出报价和确认卡，等你点。</text>
  <text x="34" y="1010" class="s"><tspan class="h">6</tspan>  状态变化写进 SQLite 并作为 SSE 事件推给浏览器；生成任务由 engine 在 turn 之外 durable 地跑完。</text>
  <text x="34" y="1040" class="m">之前（v7 · 6.0.0）：只有 2 个技能包且每轮整包塞进 context（约 76 KB）；13 个 tool；只有 Viggle；固定横屏；片段静音；Director 不能设配乐、移动、导出、撤销。</text>
  <text x="34" y="1058" class="m">现在（v8 · 7.0.0）：按类型路由 22 个包，每轮最多注入约 7.3k 词；新增 read_guidance、set_soundtrack、analyze_music、编辑/导出/角色/风格工具。</text>
  <text x="34" y="1084" class="m">Framework：React 19 · Vite · Fastify · better-sqlite3 · ajv · @babel/parser · pdfjs-dist · ffmpeg · Node 24 · pnpm 10 · node:test + Playwright 浏览器场景。</text>

  <rect x="1046" y="938" width="454" height="160" rx="10" class="grp"/>
  <text x="1060" y="962" class="t">图例</text>
  <rect x="1060" y="976" width="34" height="18" rx="4" class="box"/><text x="1102" y="990" class="s">之前就有的组件</text>
  <rect x="1060" y="1004" width="34" height="18" rx="4" class="new"/><text x="1102" y="1018" class="s">这一轮新增或改动</text>
  <line x1="1060" y1="1040" x2="1094" y2="1040" class="lb" marker-end="url(#ab)"/><text x="1102" y="1044" class="s">一次 Director turn 的路径</text>
  <line x1="1060" y1="1066" x2="1094" y2="1066" class="ln" marker-end="url(#a)"/><text x="1102" y="1070" class="s">数据 / 调用方向</text>
  <text x="1060" y="1090" class="n">橙色小字 = 已有组件里新增的能力</text>
</svg>
