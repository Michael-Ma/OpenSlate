<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Last Ferry · Film</title>
<link rel="stylesheet" href="system.css">
<style>
/* Film: play the whole film in storyboard order, adjust order, length and music, export. */
#view{display:flex;flex-direction:column;gap:14px;flex:1;min-height:0}
.work.film-work{overflow:hidden}
.film-stage{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;flex:0 1 392px;min-height:300px}
.player .pic{background:var(--surface-stripe)}
.player .pv-top .end{margin-left:auto;display:flex;gap:8px;align-items:center}
.music-on{display:inline-flex;align-items:center;gap:6px;background:rgba(20,21,23,.78);border-radius:var(--r-pill);padding:2px 9px;font-size:11.5px;font-weight:600;color:var(--text)}
.meter{display:inline-flex;gap:2px;align-items:flex-end;height:10px}
.meter i{width:2px;background:var(--text);border-radius:1px;animation:lvl .9s ease-in-out infinite}
.meter i:nth-child(2){animation-delay:.2s}.meter i:nth-child(3){animation-delay:.45s}
.meter.still i{animation:none}
@keyframes lvl{0%,100%{height:3px}50%{height:10px}}
.subtitle{text-align:center;font-size:16px;font-weight:600;margin:0 0 10px;min-height:23px;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.subtitle small{display:block;font-size:11px;font-weight:600;color:var(--text-2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.player .dashed-frame{background:var(--surface)}
.scrub .scrubber{flex:1;accent-color:var(--text);height:16px;margin:0}
.scrub .skip{width:26px;height:26px;border-radius:50%;border:0;background:none;color:var(--text-2);display:grid;place-items:center;flex:none}
.scrub .skip:hover{color:var(--text);background:var(--raised)}
.approx{font-size:11px;color:var(--muted);margin-left:4px;white-space:nowrap}
/* export panel */
.export{display:flex;flex-direction:column;gap:8px;overflow:auto;padding:14px 14px 12px}
.export .big{font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.export .big small{display:block;font-size:12.5px;font-weight:500;color:var(--text-2);letter-spacing:0;margin-top:2px}
.checks{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr);gap:0 8px;font-size:12px;border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline);padding:5px 0;flex:none}
.checks .h{color:var(--muted);font-size:11px;padding:2px 0 3px}
.checks span{padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-2)}
.checks b{font-weight:700;color:var(--text)}
.checks .y{color:var(--green)}
.checks .n{color:var(--text)}
.export .go{justify-content:center;padding:8px 12px;border-radius:14px;white-space:normal;text-align:center;line-height:1.3}
.export .why{font-size:11.5px;color:var(--muted);text-align:center;margin-top:-3px;line-height:1.35}
.last-line{font-size:12.5px;color:var(--text-2)}
.last-line b{color:var(--text);font-weight:600}
.rendering{display:flex;flex-direction:column;gap:8px;border:1px solid var(--track);background:var(--raised);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--text-2)}
.rendering b{color:var(--text)}
/* timeline */
.timeline{flex:1 0 340px;min-height:0;display:flex;flex-direction:column;padding:12px 14px 10px;gap:6px;overflow:hidden}
.tl-scroll{flex:1;min-height:0;overflow-x:auto;overflow-y:auto}
.tl-grid{display:grid;grid-template-columns:92px 1fr;grid-template-rows:18px 20px minmax(78px,1fr) 30px 36px;row-gap:6px;position:relative;min-width:0;height:100%;min-height:212px}
.lane-k{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;position:sticky;left:0;background:var(--surface);z-index:3;padding-right:8px}
.lane{position:relative;min-width:0}
.ruler{height:18px;cursor:pointer}
.ruler i{position:absolute;top:0;bottom:0;border-left:1px solid var(--track)}
.ruler span{position:absolute;top:0;font-size:10.5px;color:var(--muted);padding-left:4px;font-variant-numeric:tabular-nums}
.bands{height:20px}
.band{position:absolute;top:0;bottom:0;border-radius:5px;background:var(--raised);border:1px solid var(--hairline);font-size:11px;font-weight:600;color:var(--text-2);padding:1px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pics{min-height:78px}
.blk{position:absolute;top:0;bottom:0;border-radius:8px;overflow:hidden;border:1px solid var(--hairline);background:var(--surface-stripe);padding:0;text-align:left;color:var(--text)}
.blk svg{position:absolute;inset:0;width:100%;height:100%}
.blk.kfonly svg{opacity:.55}
.blk.kfonly{border-style:dashed;border-color:var(--text-2)}
.blk.empty{background:none;border:1.5px dashed var(--track)}
.blk.sel{outline:2px solid var(--select);outline-offset:-1px;z-index:2}
.blk .badge{position:absolute;left:5px;top:5px;font-size:11px;padding:1px 5px;z-index:1}
.blk .dur{position:absolute;right:5px;bottom:4px;font-size:11px;font-weight:600;background:rgba(20,21,23,.8);border-radius:5px;padding:0 5px;z-index:1}
.blk .lack{position:absolute;left:5px;bottom:4px;font-size:10.5px;font-weight:600;color:var(--text-2);background:rgba(20,21,23,.8);border-radius:5px;padding:0 5px;z-index:1;white-space:nowrap}
.blk .letter{position:absolute;right:5px;top:5px;width:16px;height:16px;font-size:10.5px;z-index:1}
.voices{height:30px;overflow:visible}
.vblk b{font-weight:700;margin-right:4px}
.vblk{position:absolute;top:0;bottom:0;border-radius:6px;background:var(--raised-2);border:1px solid var(--track);font-size:11px;padding:0 6px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;color:var(--text)}
.vblk.loose{background:none;border-style:dashed;color:var(--text-2)}
.musicl{height:36px}
.mblk{position:absolute;top:0;bottom:0;border-radius:6px;background:var(--raised);border:1px solid var(--track);overflow:hidden;padding:0;color:var(--text);text-align:left}
.mblk .wave{position:absolute;inset:0;opacity:.45}
.mblk span{position:relative;z-index:1;font-size:11px;font-weight:600;padding:0 7px;line-height:34px;white-space:nowrap}
.mblk.muted .wave{opacity:.12}
.mblk.sel{outline:2px solid var(--select);outline-offset:-1px}
.none-music{font-size:12px;color:var(--muted);line-height:36px}
.head-sel{position:absolute;top:0;bottom:0;width:2px;background:var(--text);z-index:4;pointer-events:none;margin-left:-1px}
.head-sel::before{content:"";position:absolute;top:-4px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--text)}
.tl-tools{display:flex;align-items:center;gap:10px;min-height:36px;border-top:1px solid var(--hairline);padding-top:8px;flex-wrap:wrap;font-size:12.5px;color:var(--text-2);flex:none}
.tl-tools b{color:var(--text)}
.tl-tools .sep{width:1px;height:20px;background:var(--hairline)}
.tl-tools label{display:inline-flex;gap:8px;align-items:center}
@media (max-width: 899px){
  .work.film-work{overflow:visible}
  #view{flex:none}
  .film-stage{grid-template-columns:1fr;height:auto;flex:none;min-height:0}
  .player{aspect-ratio:16/9;width:100%}
  .player .pv-bottom{padding:18px 10px 8px}
  .subtitle{font-size:13px;margin-bottom:4px;min-height:18px}
  .approx{display:none}
  .timeline{flex:none;overflow:visible;padding:12px 12px 10px;min-height:0}
  .tl-scroll{margin:0 -12px;padding:0 12px}
  .tl-grid{grid-template-columns:70px 1fr}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
(function(){
/* ======================================================================
 * Shell: identical in every P5 page (plan, film, assets, settings, start, states).
 * Sample film, illustrations, top bar, Director column and composer, film-wide
 * states (offline, stopped, restarted, session expired), dialogs, toast and the
 * prototype review menu. Nothing here talks to a server; every action is simulated.
 * ====================================================================== */
'use strict';
const reduceMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const narrow = () => window.matchMedia('(max-width: 899px)').matches;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
const keep = { get(k){ try { return window.localStorage.getItem(k); } catch(e){ return null; } }, set(k, v){ try { window.localStorage.setItem(k, v); } catch(e){} } };
const L = { lang: keep.get('lastferry.lang') === 'zh' ? 'zh' : 'en' };
/** English first, Chinese second. Content (prompts, lines, the Director's words) stays in its own language. */
const t = (en, zh) => (L.lang === 'zh' && zh != null) ? zh : en;
const sec = n => t(`${fmt(n)} s`, `${fmt(n)} 秒`);
const fmt = n => (Math.round(n * 10) / 10).toString();
const clock = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
const money = n => '$' + n.toFixed(2);
const about = n => t(`about ${money(n)}`, `约 ${money(n)}`);
const listJoin = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + t(' and ', ' 和 ') + a[a.length - 1];
/** Host-configured estimates per operation (D15); the same numbers as last-ferry.html. */
const PRICE = { keyframe: 0.04, clip: 0.50, voice: 0.01 };

/* ---------------- the sample film (same as last-ferry.html) ---------------- */
const FILM = {
  title: 'The Last Ferry', fps: 30, demo: false,
  brief: 'A short film, under a minute. Mara catches the last ferry of the season and leaves her town for good. Quiet and cold: blue dawn light, fog, almost no dialogue. Narration in her own voice, first person, past tense.',
  story: 'At closing time Mara buys the last ticket for the morning boat. At dawn she waits on the empty pier while the ferry is readied. She boards, and as the harbour disappears into the fog she does not look back.',
  music: { id: 'au-lowtide', name: 'low-tide.mp3', length: 72, start: 4, gain: -18, muted: false }
};
const SCENES = [
  { id: 's1', title: 'Closing time', direction: 'Warm lamp light inside the ticket office. Mara arrives just before it shuts.', shots: ['sh11', 'sh12', 'sh13'] },
  { id: 's2', title: 'Harbour at dawn', direction: 'Cold blue dawn, fog on the water. Mara waits alone on the pier.', shots: ['sh21', 'sh22', 'sh23'] },
  { id: 's3', title: 'Departure', direction: 'The ferry pulls away. Mara does not look back.', shots: ['sh31', 'sh32'] }
];
const mk = (id, art, scene, framing, purpose, prompt, motion, dur, extra) => Object.assign({
  id, art, scene, framing, purpose, prompt, motion, dur,
  kf: 'ready', opened: true, takes: 1, clip: 'none', clipTakes: 0, narr: null, coat: 'maroon', fail: null
}, extra || {});
const SHOT = {};
[
  mk('sh11', '1.1', 's1', 'Wide', 'Establish the ticket office at closing time.', 'The ticket office at closing time, shutters half down, one lamp on.', 'Slow pan right', 6, { clip: 'ready', clipTakes: 1 }),
  mk('sh12', '1.2', 's1', 'Medium', 'Mara buys the last ticket.', 'Mara at the counter, sliding coins across.', 'Static', 5, { clip: 'ready', clipTakes: 1, narr: { text: 'One for the morning boat.', voice: 'ready', sec: 2.1, fit: null } }),
  mk('sh13', '1.3', 's1', 'Close-up', 'The ticket is stamped: it is real now.', 'The clerk stamps the ticket.', 'Slow push-in', 6, { clip: 'ready', clipTakes: 1 }),
  mk('sh21', '2.1', 's2', 'Wide', 'The empty harbour; the ferry is waiting.', 'The empty harbour at dawn, the ferry moored, fog over the water.', 'Slow push-in', 5),
  mk('sh22', '2.2', 's2', 'Medium', 'Mara waits on the pier, ticket in hand.', 'Mara on the pier in her red coat, a ticket in her hand.', 'Static, breath visible', 4, { opened: false }),
  mk('sh23', '2.3', 's2', 'Close-up', 'The date tells us it is the last boat.', 'The ticket’s printed date, “Sunday 31 March”, under Mara’s thumb.', 'Slow tilt down', 6, { opened: false, narr: { text: 'It was the last boat of the season, and I nearly missed it.', voice: 'ready', sec: 7.4, fit: null } }),
  mk('sh31', '3.1', 's3', 'Wide', 'The ferry pulls away into the fog.', 'The ferry pulls away into the fog.', 'Slow pull-back', 8, { kf: 'none', opened: false, takes: 0 }),
  mk('sh32', '3.2', 's3', 'Close-up', 'Mara at the rail; she does not look back.', 'Mara at the rail, the harbour behind her.', 'Static', 8, { kf: 'none', opened: false, takes: 0, narr: { text: 'I didn’t look back.', voice: 'text_only', est: 1.2, fit: null } })
].forEach(s => { SHOT[s.id] = s; });

const S = id => SHOT[id];
const sceneOf = s => SCENES.find(sc => sc.id === s.scene);
const sceneNo = sc => SCENES.indexOf(sc) + 1;
const filmShots = () => SCENES.flatMap(sc => sc.shots.map(S));
const labelOf = s => { const sc = sceneOf(s); return sceneNo(sc) + '.' + (sc.shots.indexOf(s.id) + 1); };
const sceneDur = sc => sc.shots.reduce((a, id) => a + S(id).dur, 0);
const filmDur = () => filmShots().reduce((a, s) => a + s.dur, 0);
const startOf = s => { let a = 0; for (const x of filmShots()) { if (x === s) return a; a += x.dur; } return a; };
/** Narration settled = no line, a line that fits, or a fit chosen (D: narration-fit). */
const narrLen = s => s.narr ? (s.narr.voice === 'ready' ? s.narr.sec : s.narr.est) : 0;
const narrFits = s => !s.narr || s.narr.voice !== 'ready' ? null : (s.narr.sec <= s.dur + 1e-9 || !!s.narr.fit);
const lowerFirst = x => x.charAt(0).toLowerCase() + x.slice(1);

let uid = 0;

  const u = 'g' + (++uid);
  const coat = s.coat === 'red' ? '#c8302c' : '#6e1f2b';

  let b = '';
  switch (s.art){
    case '1.1': b = `<rect width="320" height="180" fill="#1f1611"/><rect x="36" y="26" width="248" height="154" fill="#4a2e1f"/><rect x="70" y="40" width="180" height="20" rx="2" fill="#2b1b12"/>
      <text x="160" y="54.5" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#e9b871">TICKETS</text>
      <rect x="78" y="72" width="164" height="84" fill="#f0b866"/><rect x="78" y="72" width="164" height="44" fill="#6b4a33"/>
      ${[78,84,90,96,102,108,114].map(y => `<rect x="78" y="${y}" width="164" height="1.4" fill="#553826"/>`).join('')}
      <rect x="78" y="114" width="164" height="3" fill="#3a2518"/><rect x="96" y="132" width="128" height="24" fill="#c98b45"/>
      <circle cx="268" cy="70" r="46" fill="#ffcf7a" opacity=".12"/><circle cx="268" cy="70" r="22" fill="#ffcf7a" opacity=".18"/>
      <rect x="266" y="74" width="4" height="106" fill="#2b1b12"/><circle cx="268" cy="70" r="6" fill="#ffe3a8"/><rect y="166" width="320" height="14" fill="#24160f"/>`; break;
    case '1.2': b = `<rect width="320" height="180" fill="#3b2418"/>
      <rect x="190" y="18" width="110" height="88" fill="#f0b866" opacity=".9"/><rect x="190" y="18" width="110" height="88" fill="none" stroke="#2b1b12" stroke-width="4"/>
      <circle cx="248" cy="60" r="12" fill="#2b1b12"/><path d="M226 106 q22-36 44 0z" fill="#2b1b12"/>
      <circle cx="112" cy="62" r="15" fill="#d8a77f"/><path d="M96 58 q16-22 32 0 q-4-12-16-12 q-12 0-16 12z" fill="#2a1712"/>
      <path d="M78 180 L84 98 q28-14 56 0 L146 180z" fill="#b8322c"/><path d="M134 104 L196 118 L194 126 L130 116z" fill="#a52b26"/><circle cx="198" cy="121" r="6" fill="#d8a77f"/>
      <rect y="122" width="320" height="58" fill="#5c3a24"/><rect y="120" width="320" height="5" fill="#7a5032"/>
      <circle cx="214" cy="121" r="4" fill="#f2c25b"/><circle cx="226" cy="121" r="4" fill="#f2c25b"/><circle cx="238" cy="121.5" r="4" fill="#e3b04a"/>`; break;
    case '1.3': b = `<rect width="320" height="180" fill="#4a2e1f"/><circle cx="250" cy="20" r="60" fill="#ffcf7a" opacity=".1"/>
      <g transform="rotate(-6 160 110)"><rect x="70" y="78" width="180" height="76" rx="4" fill="#f1e3c4"/>
      <rect x="84" y="92" width="80" height="6" rx="2" fill="#b9a27a"/><rect x="84" y="104" width="60" height="5" rx="2" fill="#cdb995"/>
      <circle cx="206" cy="118" r="20" fill="none" stroke="#b8322c" stroke-width="3" opacity=".75"/><text x="206" y="122" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" font-weight="700" fill="#b8322c" opacity=".8">PAID</text></g>
      <rect x="190" y="36" width="34" height="22" rx="4" fill="#2b1b12"/><rect x="200" y="8" width="14" height="30" rx="5" fill="#3b2418"/>
      <ellipse cx="207" cy="62" rx="26" ry="11" fill="#d39c74"/><rect x="186" y="56" width="42" height="8" rx="3" fill="#1d120c"/>`; break;
    case '2.1': b = sky('#6c83a6', '#b7c5d6') + `<path d="M0 96 Q60 80 120 92 T240 86 T320 92 V112 H0z" fill="#7f93b0"/><rect y="108" width="320" height="72" fill="#4c6282"/>

      ${[206,216,226,236,246,256].map(x => `<rect x="${x}" y="91" width="5" height="4" fill="#c9d4e2"/>`).join('')}
      <rect x="0" y="112" width="168" height="8" fill="#2f3d52"/>${[14,52,90,128,160].map(x => `<rect x="${x}" y="118" width="5" height="24" fill="#2a374a"/>`).join('')}
      <rect y="122" width="320" height="2" fill="#9fb2c8" opacity=".35"/><rect y="136" width="320" height="1.5" fill="#9fb2c8" opacity=".25"/>${fog(126, .18)}`; break;
    case '2.2': b = sky('#6a81a4', '#b3c2d4') + `<rect y="96" width="320" height="84" fill="#4c6282"/>${fog(90, .28)}

      <circle cx="160" cy="70" r="11" fill="#c9b3a6"/><path d="M149 68 q11-16 22 0 q-2-9-11-9 q-9 0-11 9z" fill="#2a2a33"/>
      <ellipse cx="180" cy="66" rx="9" ry="5" fill="#eef3f8" opacity=".35"/><ellipse cx="190" cy="62" rx="6" ry="3.5" fill="#eef3f8" opacity=".22"/>`; break;
    case '2.3': b = `<rect width="320" height="180" fill="#56677e"/>${[0,30,60,90,120,150].map(y => `<rect y="${y}" width="320" height="1.5" fill="#4a5a70"/>`).join('')}
      <g transform="rotate(-4 160 90)"><rect x="42" y="34" width="236" height="112" rx="5" fill="#e3e8ee"/><path d="M86 34 V146" stroke="#9aa8b8" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="100" y="62" font-family="Inter,sans-serif" font-size="9" font-weight="600" letter-spacing="2" fill="#6b7a8e">HARBOUR FERRY</text>
      <text x="100" y="92" font-family="Inter,sans-serif" font-size="19" font-weight="700" fill="#22303f">SUNDAY 31 MARCH</text>
      <text x="100" y="112" font-family="Inter,sans-serif" font-size="9" font-weight="600" letter-spacing="1.5" fill="#6b7a8e">DEP 06:40 · SINGLE</text>
      <text x="64" y="96" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#22303f" transform="rotate(-90 64 92)">No 0418</text></g>
      <ellipse cx="262" cy="160" rx="44" ry="30" fill="#c6a997"/><ellipse cx="246" cy="146" rx="15" ry="10" fill="#dcc3b4"/><path d="M270 180 Q300 150 320 146 V180z" fill="${coat}"/>`; break;
    case '3.1': b = sky('#7287a6', '#c3cfdc') + `<rect y="100" width="320" height="80" fill="#566c8a"/>${fog(84, .35)}${fog(94, .3)}
      <path d="M140 100 H184 L180 107 H144z" fill="#3a4a62" opacity=".85"/><rect x="150" y="93" width="22" height="7" fill="#46586f" opacity=".85"/>
      <path d="M162 108 L110 150 M162 108 L214 150" stroke="#9fb2c8" stroke-width="1.5" opacity=".5"/>${fog(110, .25)}${fog(128, .18)}

/** A deterministic waveform for audio tiles and lanes. */
function wave(seed, n){
  let x = 0; for (const c of String(seed)) x = (x * 31 + c.charCodeAt(0)) % 997;
  let h = '';
  for (let i = 0; i < n; i++){ x = (x * 73 + 41) % 997; h += `<i style="height:${18 + (x % 70)}%"></i>`; }
  return `<div class="wave" aria-hidden="true">${h}</div>`;
}
/** Motion preview by keyword (D17): push-in, pull-back, pan, tilt, breath. */
function motionTransform(motion, p){
  const m = motion.toLowerCase();
  if (m.includes('push')) return `scale(${1 + .12 * p})`;
  if (m.includes('pull')) return `scale(${1.12 - .12 * p})`;
  if (m.includes('pan right')) return `scale(1.1) translateX(${4 - 8 * p}%)`;
  if (m.includes('pan left')) return `scale(1.1) translateX(${-4 + 8 * p}%)`;
  if (m.includes('tilt down')) return `scale(1.1) translateY(${4 - 8 * p}%)`;
  if (m.includes('breath')) return `scale(${1.012 + .01 * Math.sin(p * Math.PI * 4)})`;
  return 'none';
}

/** Guards: [data-needs="server"] needs the studio; [data-needs="run"] also starts work, so Stop turns it off. */
function guard(root){
  (root || document).querySelectorAll('[data-needs]').forEach(el => {
    const need = el.dataset.needs;
    let why = '';
    if (blocked()) why = t('Can’t reach the studio. This works again once it’s back.', '连不上工作室，恢复连接后可用。');

    if (why){ el.disabled = true; el.setAttribute('title', why); el.dataset.guarded = '1'; }
    else if (el.dataset.guarded){ el.removeAttribute('title'); delete el.dataset.guarded; if (!el.dataset.off) el.disabled = false; }
  });
}

/* ---------------- dialogs (native <dialog>; focus returns to the opener) ---------------- */
function openDialog(html, cls){
  const opener = document.activeElement;
  const d = document.createElement('dialog');
  d.className = cls || 'dialog';
  d.innerHTML = html;
  document.body.appendChild(d);
  d.addEventListener('close', () => { d.remove(); if (opener && opener.isConnected) opener.focus({ preventScroll: true }); else { const w = $('view'); if (w) w.focus && w.focus(); } });
  d.showModal();
  const f = d.querySelector('[autofocus]') || d.querySelector('input,textarea,select,button:not([disabled])');
  if (f) f.focus();
  return d;
}
/** A small action menu under its button; Esc or an outside click closes it and focus returns. */
function openMenu(btn, html){

  document.body.appendChild(m);
  const r = btn.getBoundingClientRect();
  const left = Math.max(8, Math.min(r.right - m.offsetWidth, window.innerWidth - m.offsetWidth - 8));
  const top = r.bottom + 4 + m.offsetHeight > window.innerHeight - 8 ? r.top - 4 - m.offsetHeight : r.bottom + 4;
  m.style.left = left + 'px'; m.style.top = Math.max(8, top) + 'px'; m.style.visibility = '';
  Shell.menuOpener = btn; btn.setAttribute('aria-expanded', 'true');
  const f = m.querySelector('button:not([disabled]),a'); f && f.focus();

/* ---------- readiness: ExportReadiness from storyboard order (SB-16, SB-17) ---------- */
function readiness(){
  const list = filmShots(), blockers = [];
  for (const s of list){
    if (s.clip === 'none' || s.clip === 'failed' || s.fail) blockers.push({ code: 'no_clip', s });
    else if (s.clip === 'outdated') blockers.push({ code: 'clip_outdated', s });
    if (s.narr && narrFits(s) !== true) blockers.push({ code: 'voice_unsettled', s });
  }
  if (filmDur() > 360) blockers.push({ code: 'too_long' });
  if (!list.length) blockers.push({ code: 'empty_film' });
  return { ready: !blockers.length, demo: FILM.demo, seconds: filmDur(), blockers };
}
const clipCell = s => s.clip === 'ready' ? `<span class="y">✓ ${FILM.demo ? t('demo clip', '示例视频') : t('clip', '视频')}</span>` : s.clip === 'outdated' ? `<span class="n">${t('out of date', '已过期')}</span>` : `<span class="n">${t('no clip', '没有视频')}</span>`;
const voiceCell = s => {
  if (!s.narr) return `<span>${t('no line', '无旁白')}</span>`;
  if (s.narr.voice !== 'ready') return `<span class="n">${t('no voice yet', '还没有配音')}</span>`;

  return `<span class="n">${t(`${fmt(s.narr.sec)} s, too long`, `${fmt(s.narr.sec)} 秒，太长`)}</span>`;
};
function whyText(r){

    const letter = s.id === 'sh22' ? '<span class="letter" title="Director note a">a</span>' : s.id === 'sh23' && narrFits(s) === false ? '<span class="letter" title="Director note b">b</span>' : '';
    return `<button class="blk${cls}${F.sel === s.id ? ' sel' : ''}" style="left:${X(st)};width:calc(${Wd(s.dur)} - 3px)" data-act="sel-shot" data-id="${s.id}" aria-pressed="${F.sel === s.id}" aria-label="${L1}, ${esc(s.framing)}, ${s.dur} s${lack ? ', ' + lack : ''}">
      ${s.kf === 'ready' || s.kf === 'outdated' ? pic(s) : ''}<span class="badge">${L1}</span>${letter}${lack && s.dur >= 4 ? `<span class="lack">${lack}</span>` : ''}<span class="dur">${s.dur} s</span></button>`;
  }).join('');
  a = 0;
  const voices = list.map(s => {
    const st = a; a += s.dur;
    if (!s.narr) return '';
    const L1 = labelOf(s), n = s.narr;
    if (n.voice !== 'ready') return `<span class="vblk loose" style="left:${X(st)};width:calc(${Wd(Math.max(n.est, 3))} - 3px)" title="${esc(n.text)}"><b>${L1}</b> ${t('no voice yet', '还没有配音')}</span>`;
    if (!narrFits(s)) return `<span class="vblk loose" style="left:${X(st)};width:calc(${Wd(n.sec)} - 3px)" title="${esc(n.text)}"><b>${L1}</b> ${t(`${fmt(n.sec)} s, too long · not placed`, `${fmt(n.sec)} 秒，太长 · 未放入`)}</span>`;
    return `<span class="vblk" style="left:${X(st)};width:calc(${Wd(Math.min(n.sec, s.dur))} - 3px)" title="“${esc(n.text)}” · ${fmt(n.sec)} s"><b>${L1}</b> “${esc(n.text)}”</span>`;
  }).join('');
  const m = FILM.music;
  const music = m ? `<button class="mblk${m.muted ? ' muted' : ''}${F.sel === 'music' ? ' sel' : ''}" style="left:${X(Math.min(m.start, total))};width:calc(${Wd(Math.max(0, Math.min(total, m.start + m.length) - m.start))} - 2px)" data-act="sel-music" aria-pressed="${F.sel === 'music'}" aria-label="${t('Music', '音乐')} ${esc(m.name)}">${wave(m.name, 90)}<span>${esc(m.name)} · ${m.muted ? t('muted', '已静音') : `${m.gain} dB`}</span></button>`
    : `<span class="none-music">${t('No music.', '没有音乐。')} <button class="pill sm" data-act="music-menu" data-needs="server">${t('Choose music', '选择音乐')}</button></span>`;
  return `<section class="panel timeline" aria-label="${t('Timeline', '时间线')}">
    <div class="panel-head"><span class="eyebrow">${t('Timeline', '时间线')}</span><span class="dim" style="font-size:12.5px">${t('storyboard order · edits here are free and take effect at once', '按故事板顺序 · 这里的修改免费，立即生效')}</span></div>
    <div class="tl-scroll" id="tl-scroll"><div class="tl-grid" style="${px ? `width:${W + 70}px` : ''}">
      <span class="lane-k"></span><div class="lane ruler" data-act="seek" id="ruler">${ruler}</div>
      <span class="lane-k">${t('Scenes', '场景')}</span><div class="lane bands">${bands}</div>
      <span class="lane-k">${t('Picture', '画面')}</span><div class="lane pics" id="lane-pics">${pics}<span class="head-sel" id="head" aria-hidden="true"></span></div>
      <span class="lane-k">${t('Narration', '旁白')}</span><div class="lane voices">${voices}</div>
      <span class="lane-k">${t('Music', '音乐')}${m ? `<button class="icon-btn" style="width:22px;height:22px" data-act="mute" data-needs="server" aria-pressed="${m.muted}" aria-label="${m.muted ? t('Unmute music', '取消静音') : t('Mute music', '静音')}" title="${m.muted ? t('Unmute', '取消静音') : t('Mute', '静音')}">${m.muted ? '<svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 4h2.5L7 1v10L3.5 8H1z" fill="currentColor"/><path d="M8.5 4l3 4m0-4-3 4" stroke="currentColor" stroke-width="1.3"/></svg>' : '<svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 4h2.5L7 1v10L3.5 8H1z" fill="currentColor"/><path d="M9 3.5a3.5 3.5 0 0 1 0 5" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>'}</button>` : ''}</span><div class="lane musicl">${music}</div>
    </div></div>
    <div class="tl-tools" id="tools">${toolsHTML()}</div>
  </section>`;
}
function toolsHTML(){
  if (F.sel === 'music' && FILM.music){
    const m = FILM.music;
    return `<b>${t('Music', '音乐')} · ${esc(m.name)}</b>
      <span class="sep" aria-hidden="true"></span>
      <span>${t('Starts at', '起点')}</span><span class="stepper" role="group" aria-label="${t('Music start', '音乐起点')}"><button data-act="mstart" data-d="-1" data-needs="server" aria-label="${t('Earlier', '提前')}" ${m.start <= 0 ? 'disabled data-off="1"' : ''}>−</button><output>${clock(m.start)}</output><button data-act="mstart" data-d="1" data-needs="server" aria-label="${t('Later', '推后')}" ${m.start >= filmDur() - 1 ? 'disabled data-off="1"' : ''}>+</button></span>
      <label>${t('Volume', '音量')} <input type="range" class="range" id="gain" min="-60" max="0" step="1" value="${m.gain}" data-needs="server" aria-label="${t('Music volume in dB', '音乐音量（dB）')}"><output id="gain-out" class="num">${m.gain} dB</output></label>
      <label>${t('Mute', '静音')} <button class="switch" role="switch" aria-checked="${m.muted}" data-act="mute" data-needs="server" aria-label="${t('Mute music', '静音')}"></button></label>
      <button class="pill sm" data-act="music-menu" data-needs="server" aria-haspopup="menu" aria-expanded="false">${t('Change music', '更换音乐')}</button>`;
  }
  const s = F.sel && S(F.sel);
  if (s){
    const sc = sceneOf(s), i = sc.shots.indexOf(s.id), L1 = labelOf(s);
    const floor = s.narr && s.narr.voice === 'ready' && narrFits(s) ? Math.max(3, Math.ceil(s.narr.sec)) : 3;
    return `<b>${L1} ${esc(s.framing)}</b>
      <span class="sep" aria-hidden="true"></span>
      <span>${t('Length', '时长')}</span><span class="stepper" role="group" aria-label="${t('Shot length', '镜头时长')}"><button data-act="len" data-d="-1" data-needs="server" aria-label="${t('Shorter', '缩短')}" ${s.dur <= floor ? 'disabled data-off="1"' : ''} title="${s.dur <= floor && floor > 3 ? t(`Its voice line is ${fmt(s.narr.sec)} s`, `配音长 ${fmt(s.narr.sec)} 秒`) : ''}">−</button><output>${s.dur} s</output><button data-act="len" data-d="1" data-needs="server" aria-label="${t('Longer', '加长')}" ${s.dur >= 15 ? 'disabled data-off="1"' : ''}>+</button></span>
      <span class="hint">${[floor > 3 ? t(`at least ${floor} s (voice line)`, `至少 ${floor} 秒（配音）`) : '', s.clip === 'ready' ? t('a new length outdates its clip', '改时长会让视频过期') : ''].filter(Boolean).join(' · ')}</span>
      <span class="sep" aria-hidden="true"></span>
      <button class="pill sm" data-act="move" data-d="-1" data-needs="server" ${i === 0 ? 'disabled data-off="1" title="' + t('First in its scene; reorder scenes in the Plan', '已是这一场的第一个；场景顺序在计划里调整') + '"' : ''}>${t('Move earlier', '往前移')}</button>
      <button class="pill sm" data-act="move" data-d="1" data-needs="server" ${i === sc.shots.length - 1 ? 'disabled data-off="1" title="' + t('Last in its scene; reorder scenes in the Plan', '已是这一场的最后一个；场景顺序在计划里调整') + '"' : ''}>${t('Move later', '往后移')}</button>
      <a class="pill sm ghost" href="last-ferry.html">${t('Open in Keyframes', '在关键帧里打开')}</a>`;
  }
  return `<span>${t('Select a shot to change its length or order, or the music to change it.', '选择一个镜头来改时长或顺序，或选择音乐来调整。')}</span>`;
}

/* ---------- playback: picture, narration and music on one clock (simulated; no sound) ---------- */
let lastShot = null;
function paintPlayer(force){
  const total = filmDur(), at = shotAt(F.t);
  if (!at) return;
  const { s, start } = at, local = F.t - start, p = Math.min(1, local / s.dur);
  if (force || lastShot !== s.id){
    lastShot = s.id;
    const L1 = labelOf(s);
    let inner;
    if (s.clip === 'ready') inner = `<div class="pv-anim" id="pl-anim">${pic(s)}</div>`;
    else if (s.kf === 'ready' || s.kf === 'outdated') inner = `<div class="pv-anim" id="pl-anim" style="opacity:.6">${pic(s)}</div>`;
    else inner = `<div class="dashed-frame"><div><b>${t('No keyframe yet', '还没有关键帧')}</b>${esc(s.prompt)}</div></div>`;
    $('pl-pic').innerHTML = inner;
    const st = s.clip === 'ready' ? `<span class="status ok">✓ ${FILM.demo ? t('Demo clip', '示例视频') : t('Clip', '视频')}</span>` : s.kf === 'ready' ? `<span class="status">${t('Keyframe only · no clip yet', '只有关键帧 · 还没有视频')}</span>` : `<span class="status">${t('Nothing made yet', '还没有生成内容')}</span>`;
    $('pl-top').innerHTML = `<span class="badge">${L1}</span>${st}<span class="end">${FILM.demo ? '<span class="demo-mark" title="Burned into every frame of a demo export">DEMO</span>' : ''}<span id="pl-music"></span></span>`;
    document.querySelectorAll('.blk').forEach(b => b.classList.toggle('playing', b.dataset.id === s.id));
  }
  const anim = $('pl-anim');
  if (anim && s.clip === 'ready') anim.style.transform = reduceMotion() || !F.playing && local === 0 ? 'none' : motionTransform(s.motion, p);
  const n = s.narr, sub = $('pl-sub');
  const speaking = n && n.voice === 'ready' && narrFits(s) && local < Math.min(n.sec, s.dur);
  sub.innerHTML = speaking ? `<small>${t('Narration', '旁白')}</small>“${esc(n.text)}”` : '';
  const m = FILM.music, mEl = $('pl-music');
  if (mEl) mEl.innerHTML = m && !m.muted && F.t >= m.start && F.t < m.start + m.length ? `<span class="music-on">${F.playing && !reduceMotion() ? '<span class="meter" aria-hidden="true"><i></i><i></i><i></i></span>' : '<span aria-hidden="true">♪</span>'}${esc(m.name)} · ${m.gain} dB</span>` : '';
  $('pl-time').textContent = clock(F.t);
  const r = $('pl-range'); if (r && document.activeElement !== r) r.value = F.t;
  const head = $('head');
  if (head) head.style.left = F.pxs ? `${F.t * F.pxs}px` : `${(F.t / total) * 100}%`;
}
let raf = null, t0 = 0, tStart = 0;
function play(){
  if (F.playing) return pause();
  if (F.t >= filmDur() - 0.05) F.t = 0;
  F.playing = true; t0 = performance.now(); tStart = F.t;
  setPlayBtn();
  const step = now => {
    if (!F.playing) return;
    F.t = Math.min(filmDur(), tStart + (now - t0) / 1000);
    paintPlayer(false);
    if (F.t >= filmDur()){ F.playing = false; setPlayBtn(); paintPlayer(true); return; }
    raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}
function pause(){ F.playing = false; cancelAnimationFrame(raf); setPlayBtn(); paintPlayer(true); }
function setPlayBtn(){
  const b = $('pl-play'); if (!b) return;
  b.setAttribute('aria-label', F.playing ? t('Pause', '暂停') : t('Play the film', '播放成片'));
  b.innerHTML = F.playing ? '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x="1" y="1" width="3" height="8" fill="currentColor"/><rect x="6" y="1" width="3" height="8" fill="currentColor"/></svg>' : '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1l7 4-7 4z" fill="currentColor"/></svg>';
}
function seek(time){ F.t = Math.max(0, Math.min(filmDur(), time)); if (F.playing){ t0 = performance.now(); tStart = F.t; } paintPlayer(true); }
document.addEventListener('input', e => {
  if (e.target.id === 'pl-range') seek(+e.target.value);
  if (e.target.id === 'gain'){ $('gain-out').textContent = e.target.value + ' dB'; }
});
document.addEventListener('change', e => {
  if (e.target.id === 'gain' && FILM.music && +e.target.value !== FILM.music.gain){
    const v = +e.target.value;
    change(t(`Music volume ${v} dB.`, `音乐音量 ${v} dB。`), 'music', () => { FILM.music.gain = v; });
    const g = $('gain'); g && g.focus();
  }
});

/* ---------- export (simulated: no file is written) ---------- */
let exTimer = null;
function startExport(){
  const r = readiness(); if (!r.ready) return;
  F.exp = { state: 'rendering', started: performance.now(), elapsed: 0, demo: r.demo };
  render();
  clearInterval(exTimer);
  exTimer = setInterval(() => {
    if (!F.exp || F.exp.state !== 'rendering'){ clearInterval(exTimer); return; }
    F.exp.elapsed = (performance.now() - F.exp.started) / 1000;
    const el = $('ex-el'); if (el) el.textContent = clock(F.exp.elapsed);
    if (F.exp.elapsed >= 6){
      clearInterval(exTimer);
      if (F.last) F.history++;
      F.last = { at: t('Today 14:32', '今天 14:32'), outdatedBy: [], demo: F.exp.demo, state: 'done' };
      F.exp = null; render();
      toast(t('Export finished: the-last-ferry.mp4 is ready to download.', '导出完成：the-last-ferry.mp4 可以下载了。'));
    }
  }, 250);
}

/* ---------- states ---------- */
function makeAll(){
  filmShots().forEach(s => { s.kf = 'ready'; s.opened = true; s.takes = Math.max(1, s.takes); s.clip = 'ready'; s.clipTakes = 1; s.fail = null; });
  S('sh23').dur = 8; S('sh23').narr.fit = 'extend_shot';
  S('sh32').narr = { text: 'I didn’t look back.', voice: 'ready', sec: 1.6, fit: null };
}
const PAGE = {
  view: 'Film', workClass: 'film-work',
  scope: () => t('Whole film', '整部影片'),
  states: [
    { id: 'now', label: 'Now: only Scene 1 has clips' },
    { id: 'ready', label: 'Every clip made · last export outdated' },
    { id: 'rendering', label: 'Exporting' },
    { id: 'done', label: 'Export finished' },
    { id: 'interrupted', label: 'Export interrupted by a restart' },
    { id: 'failed', label: 'Export failed' },
    { id: 'demo', label: 'Demo film (stamped Demo)' }
  ],
  state: 'now',
  onState(id){
    pause(); clearInterval(exTimer); restore(PRISTINE); F.sel = null; F.undo = null; F.exp = null; F.last = null; F.history = 0; F.t = 0; hideToast();
    if (id !== 'now') makeAll();
    if (id === 'ready'){ F.last = { at: t('Today 14:02', '今天 14:02'), outdatedBy: ['order', 'music'], state: 'done' }; F.history = 2; }
    if (id === 'rendering'){ F.last = { at: t('Today 14:02', '今天 14:02'), outdatedBy: ['order', 'music'], state: 'done' }; F.history = 2; setTimeout(startExport, 0); }
    if (id === 'done'){ F.last = { at: t('Today 14:32', '今天 14:32'), outdatedBy: [], state: 'done' }; F.history = 3; }
    if (id === 'interrupted'){ F.exp = { state: 'interrupted' }; F.last = { at: t('Today 14:02', '今天 14:02'), outdatedBy: ['order', 'music'], state: 'done' }; F.history = 2; }
    if (id === 'failed'){ F.exp = { state: 'failed' }; F.last = { at: t('Today 14:02', '今天 14:02'), outdatedBy: ['order', 'music'], state: 'done' }; F.history = 2; }
    if (id === 'demo'){ FILM.demo = true; F.last = null; }
  },
  render,
  openShot(id){ F.sel = id; const s = S(id); seek(startOf(s)); render(); const b = document.querySelector(`.blk[data-id="${id}"]`); b && b.scrollIntoView({ block: 'nearest', inline: 'center' }); },
  pickerExtra(){ return FILM.music ? `<h4>${t('Music', '音乐')}</h4><button data-act="sh-pick" data-ref="${esc(FILM.music.name)}">${esc(FILM.music.name)}<span>${t('film music', '影片音乐')}</span></button>` : ''; },
  onEscape(){ if (F.sel){ F.sel = null; render(); return true; } return false; },
  act(a, el, e){
    switch (a){
      case 'play': return play();
      case 'prev': { const at = shotAt(F.t), list = filmShots(), i = list.indexOf(at.s); const target = F.t - at.start > 1 || i === 0 ? at.start : startOf(list[i - 1]); return seek(target); }
      case 'next': { const at = shotAt(F.t), list = filmShots(), i = list.indexOf(at.s); return seek(i < list.length - 1 ? startOf(list[i + 1]) : filmDur()); }
      case 'seek': { const r = el.getBoundingClientRect(); const x = e.clientX - r.left; return seek(F.pxs ? x / F.pxs : (x / r.width) * filmDur()); }
      case 'sel-shot': { F.sel = F.sel === el.dataset.id ? null : el.dataset.id; if (F.sel) seek(startOf(S(F.sel))); $('tools').innerHTML = toolsHTML(); document.querySelectorAll('.blk').forEach(b => { b.classList.toggle('sel', b.dataset.id === F.sel); b.setAttribute('aria-pressed', b.dataset.id === F.sel); }); document.querySelectorAll('.mblk').forEach(b => { b.classList.remove('sel'); b.setAttribute('aria-pressed', 'false'); }); return guard(); }
      case 'sel-music': { F.sel = F.sel === 'music' ? null : 'music'; if (F.sel) seek(FILM.music.start); $('tools').innerHTML = toolsHTML(); document.querySelectorAll('.blk').forEach(b => { b.classList.remove('sel'); b.setAttribute('aria-pressed', 'false'); }); document.querySelectorAll('.mblk').forEach(b => { b.classList.toggle('sel', F.sel === 'music'); b.setAttribute('aria-pressed', F.sel === 'music'); }); return guard(); }
      case 'len': {
        const s = S(F.sel), d = +el.dataset.d, L1 = labelOf(s), nd = Math.max(3, Math.min(15, s.dur + d));
        change(t(`${L1} is ${nd} s. The film is ${filmDur() + nd - s.dur} s${s.clip === 'ready' ? `; ${L1}’s clip is out of date` : ''}.`, `${L1} 改为 ${nd} 秒，影片 ${filmDur() + nd - s.dur} 秒${s.clip === 'ready' ? `；${L1} 的视频已过期` : ''}。`), 'shots', () => { if (s.clip === 'ready') s.clip = 'outdated'; s.dur = nd; });
        const b = document.querySelector(`[data-act="len"][data-d="${d}"]`); b && !b.disabled && b.focus(); return;
      }
      case 'move': {
        const s = S(F.sel), sc = sceneOf(s), i = sc.shots.indexOf(s.id), j = i + +el.dataset.d, before = labelOf(s);
        change(t(`Moved ${before}; it is now ${sceneNo(sc)}.${j + 1}. Nothing made goes out of date.`, `已移动 ${before}，现在是 ${sceneNo(sc)}.${j + 1}。没有内容过期。`), 'order', () => { sc.shots.splice(i, 1); sc.shots.splice(j, 0, s.id); });
        seek(startOf(s)); const b = document.querySelector(`[data-act="move"][data-d="${el.dataset.d}"]`); b && !b.disabled && b.focus(); return;
      }
      case 'mute': { const m = FILM.music; change(m.muted ? t('Music on.', '音乐已打开。') : t('Music muted.', '音乐已静音。'), 'music', () => { m.muted = !m.muted; }); return; }
      case 'mstart': { const m = FILM.music, ns = Math.max(0, m.start + +el.dataset.d); change(t(`Music starts at ${clock(ns)}.`, `音乐从 ${clock(ns)} 开始。`), 'music', () => { m.start = ns; }); const b = document.querySelector(`[data-act="mstart"][data-d="${el.dataset.d}"]`); b && !b.disabled && b.focus(); return; }
      case 'music-menu': return openMenu(el, `<h4>${t('Music in this film’s assets', '这部影片素材里的音乐')}</h4>
          <button role="menuitemradio" aria-checked="${FILM.music && FILM.music.name === 'low-tide.mp3'}" data-act="pick-music" data-v="low-tide.mp3">low-tide.mp3 <span class="muted">1:12</span></button>
          <button role="menuitemradio" aria-checked="${FILM.music && FILM.music.name === 'foghorn-theme.wav'}" data-act="pick-music" data-v="foghorn-theme.wav">foghorn-theme.wav <span class="muted">0:58</span></button>
          <button role="menuitemradio" aria-checked="${!FILM.music}" data-act="pick-music" data-v="">${t('No music', '不要音乐')}</button><hr>
          <a role="menuitem" href="assets.html#import">${t('Import music in Assets…', '在素材里导入音乐…')}</a>`);
      case 'pick-music': {
        const v = el.dataset.v;
        change(v ? t(`Music is ${v}.`, `音乐换成 ${v}。`) : t('No music.', '已去掉音乐。'), 'music', () => { FILM.music = v ? { id: v, name: v, length: v.startsWith('fog') ? 58 : 72, start: FILM.music ? FILM.music.start : 0, gain: FILM.music ? FILM.music.gain : -18, muted: false } : null; if (!v) F.sel = null; });
        return;
      }
      case 'point': return pointAt(el.dataset.ref);
      case 'ex-start': F.exp = null; return startExport();
      case 'ex-cancel': clearInterval(exTimer); F.exp = { state: 'cancelled' }; render(); return toast(t('Export cancelled.', '已取消导出。'));
      case 'ex-recover': F.exp.checking = true; render(); return setTimeout(() => { F.exp = null; F.history++; F.last = { at: t('Today 14:33', '今天 14:33'), outdatedBy: [], state: 'done' }; render(); toast(t('Found the finished export. Nothing was rendered again.', '找到了已完成的导出，没有重新渲染。')); }, 1200);
      case 'ex-download': return toast(t('In the studio this downloads the-last-ferry.mp4. This prototype has no file.', '在工作室里这会下载 the-last-ferry.mp4。原型里没有文件。'));
    }
  }
};
mount(PAGE);
window.addEventListener('resize', () => { const n = narrow(); if (n !== F.wasNarrow){ F.wasNarrow = n; render(); } });
F.wasNarrow = narrow();
window.LastFerryFilm = { F, PAGE, SHOT, SCENES, FILM, Shell, seek, play, pause };
})();
</script>
</body>
</html>
