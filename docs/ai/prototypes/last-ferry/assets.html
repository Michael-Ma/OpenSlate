<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Last Ferry · Assets</title>
<link rel="stylesheet" href="system.css">
<style>
/* Assets: everything the film has made or been given, on the shot it belongs to. */
.work.assets-work{overflow:hidden}
#view{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;flex:none}
.filters .select{width:auto;padding:5px 10px;border-radius:var(--r-pill);font-size:12.5px;background:var(--bar);border-color:var(--hairline)}
.filters .count{margin-left:auto;color:var(--muted);font-size:12.5px}
.lib{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;flex:1;min-height:0}
.groups{overflow:auto;min-height:0;display:flex;flex-direction:column;gap:14px;padding-right:2px}
.group{padding:0;flex:none}
.group > h2{margin:0;padding:11px 16px;font-size:14px;font-weight:700;display:flex;gap:9px;align-items:center;border-bottom:1px solid var(--hairline)}
.group > h2 .meta{color:var(--text-2);font-weight:500;font-size:12.5px}
.sno{width:22px;height:22px;border-radius:7px;background:var(--raised-2);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.shotset{display:grid;grid-template-columns:132px minmax(0,1fr);gap:12px;padding:12px 16px;border-top:1px solid var(--hairline)}
.group > h2 + .shotset{border-top:0}
.shotset .who b{display:block;font-size:13.5px}
.shotset .who span{font-size:12px;color:var(--text-2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;border:1px solid var(--hairline);background:var(--bar);border-radius:12px;padding:6px 6px 8px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0;color:var(--text)}
.tile:hover{border-color:var(--track)}
.tile[aria-pressed="true"]{border:2px solid var(--select);padding:5px 5px 7px}
.tile-pic{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--surface-stripe)}
.tile-pic svg{width:100%;height:100%;display:block}
.tile-pic .wave{height:100%;background:var(--raised)}
.tile-pic .kind{position:absolute;left:5px;bottom:5px;font-size:10.5px;font-weight:700;background:rgba(20,21,23,.86);border-radius:5px;padding:1px 6px}
.tile-pic .dur{position:absolute;right:5px;bottom:5px;font-size:10.5px;font-weight:700;background:rgba(20,21,23,.86);border-radius:5px;padding:1px 6px}
.tile b{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .sub{font-size:11.5px;color:var(--text-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tile .cur{color:var(--green);font-weight:600}
.nothing{color:var(--muted);font-size:12.5px;align-self:center}
.empty-state{padding:22px 16px;color:var(--text-2);font-size:13px;line-height:1.5}
/* detail */
.detail{display:flex;flex-direction:column;gap:10px;overflow:auto;padding:14px}
.detail .big-pic{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--surface-stripe);flex:none}
.detail .big-pic svg{width:100%;height:100%;display:block}
.detail .big-pic .wave{height:100%;background:var(--raised)}
.detail .big-pic .ph{position:absolute;top:0;bottom:0;width:2px;background:var(--text);left:0;display:none}
.detail h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.3;overflow-wrap:anywhere}
.detail .acts{display:flex;flex-direction:column;gap:7px;margin-top:auto;padding-top:6px}
.detail .acts .pill{justify-content:center;padding:7px 10px}
.detail .playrow{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums}
.detail .rows{grid-template-columns:70px 1fr;font-size:13px}
.file-list{display:flex;flex-direction:column;gap:6px}
.file-opt{display:flex;gap:10px;align-items:center;border:1px solid var(--hairline);background:var(--surface);border-radius:12px;padding:8px 12px;text-align:left;color:var(--text)}
.file-opt[aria-checked="true"]{border:2px solid var(--select);padding:7px 11px}
.file-opt span{color:var(--text-2);font-size:12px;margin-left:auto}
@media (max-width: 899px){
  .work.assets-work{overflow:visible}
  #view{flex:none}
  .filters .count{margin-left:0;width:100%}
  .lib{grid-template-columns:1fr}
  .groups{overflow:visible}
  .lib > .detail{display:none}
  .shotset{grid-template-columns:1fr;padding:12px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .group > h2{padding:11px 12px}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
(function(){
/* ======================================================================
 * Shell: identical in every P5 page (plan, film, assets, settings, start, states).
 * Sample film, illustrations, top bar, Director column and composer, film-wide
 * states (offline, stopped, restarted, session expired), dialogs, toast and the
 * prototype review menu. Nothing here talks to a server; every action is simulated.
 * ====================================================================== */
'use strict';
const reduceMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const narrow = () => window.matchMedia('(max-width: 899px)').matches;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
const keep = { get(k){ try { return window.localStorage.getItem(k); } catch(e){ return null; } }, set(k, v){ try { window.localStorage.setItem(k, v); } catch(e){} } };
const L = { lang: keep.get('lastferry.lang') === 'zh' ? 'zh' : 'en' };
/** English first, Chinese second. Content (prompts, lines, the Director's words) stays in its own language. */
const t = (en, zh) => (L.lang === 'zh' && zh != null) ? zh : en;
const sec = n => t(`${fmt(n)} s`, `${fmt(n)} 秒`);
const fmt = n => (Math.round(n * 10) / 10).toString();
const clock = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
const money = n => '$' + n.toFixed(2);
const about = n => t(`about ${money(n)}`, `约 ${money(n)}`);
const listJoin = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + t(' and ', ' 和 ') + a[a.length - 1];
/** Host-configured estimates per operation (D15); the same numbers as last-ferry.html. */
const PRICE = { keyframe: 0.04, clip: 0.50, voice: 0.01 };

/* ---------------- the sample film (same as last-ferry.html) ---------------- */
const FILM = {
  title: 'The Last Ferry', fps: 30, demo: false,
  brief: 'A short film, under a minute. Mara catches the last ferry of the season and leaves her town for good. Quiet and cold: blue dawn light, fog, almost no dialogue. Narration in her own voice, first person, past tense.',
  story: 'At closing time Mara buys the last ticket for the morning boat. At dawn she waits on the empty pier while the ferry is readied. She boards, and as the harbour disappears into the fog she does not look back.',
  music: { id: 'au-lowtide', name: 'low-tide.mp3', length: 72, start: 4, gain: -18, muted: false }
};
const SCENES = [
  { id: 's1', title: 'Closing time', direction: 'Warm lamp light inside the ticket office. Mara arrives just before it shuts.', shots: ['sh11', 'sh12', 'sh13'] },
  { id: 's2', title: 'Harbour at dawn', direction: 'Cold blue dawn, fog on the water. Mara waits alone on the pier.', shots: ['sh21', 'sh22', 'sh23'] },
  { id: 's3', title: 'Departure', direction: 'The ferry pulls away. Mara does not look back.', shots: ['sh31', 'sh32'] }
];
const mk = (id, art, scene, framing, purpose, prompt, motion, dur, extra) => Object.assign({
  id, art, scene, framing, purpose, prompt, motion, dur,
  kf: 'ready', opened: true, takes: 1, clip: 'none', clipTakes: 0, narr: null, coat: 'maroon', fail: null
}, extra || {});
const SHOT = {};
[
  mk('sh11', '1.1', 's1', 'Wide', 'Establish the ticket office at closing time.', 'The ticket office at closing time, shutters half down, one lamp on.', 'Slow pan right', 6, { clip: 'ready', clipTakes: 1 }),
  mk('sh12', '1.2', 's1', 'Medium', 'Mara buys the last ticket.', 'Mara at the counter, sliding coins across.', 'Static', 5, { clip: 'ready', clipTakes: 1, narr: { text: 'One for the morning boat.', voice: 'ready', sec: 2.1, fit: null } }),
  mk('sh13', '1.3', 's1', 'Close-up', 'The ticket is stamped: it is real now.', 'The clerk stamps the ticket.', 'Slow push-in', 6, { clip: 'ready', clipTakes: 1 }),
  mk('sh21', '2.1', 's2', 'Wide', 'The empty harbour; the ferry is waiting.', 'The empty harbour at dawn, the ferry moored, fog over the water.', 'Slow push-in', 5),
  mk('sh22', '2.2', 's2', 'Medium', 'Mara waits on the pier, ticket in hand.', 'Mara on the pier in her red coat, a ticket in her hand.', 'Static, breath visible', 4, { opened: false }),
  mk('sh23', '2.3', 's2', 'Close-up', 'The date tells us it is the last boat.', 'The ticket’s printed date, “Sunday 31 March”, under Mara’s thumb.', 'Slow tilt down', 6, { opened: false, narr: { text: 'It was the last boat of the season, and I nearly missed it.', voice: 'ready', sec: 7.4, fit: null } }),
  mk('sh31', '3.1', 's3', 'Wide', 'The ferry pulls away into the fog.', 'The ferry pulls away into the fog.', 'Slow pull-back', 8, { kf: 'none', opened: false, takes: 0 }),
  mk('sh32', '3.2', 's3', 'Close-up', 'Mara at the rail; she does not look back.', 'Mara at the rail, the harbour behind her.', 'Static', 8, { kf: 'none', opened: false, takes: 0, narr: { text: 'I didn’t look back.', voice: 'text_only', est: 1.2, fit: null } })
].forEach(s => { SHOT[s.id] = s; });

const S = id => SHOT[id];
const sceneOf = s => SCENES.find(sc => sc.id === s.scene);
const sceneNo = sc => SCENES.indexOf(sc) + 1;
const filmShots = () => SCENES.flatMap(sc => sc.shots.map(S));
const labelOf = s => { const sc = sceneOf(s); return sceneNo(sc) + '.' + (sc.shots.indexOf(s.id) + 1); };
const sceneDur = sc => sc.shots.reduce((a, id) => a + S(id).dur, 0);
const filmDur = () => filmShots().reduce((a, s) => a + s.dur, 0);
const startOf = s => { let a = 0; for (const x of filmShots()) { if (x === s) return a; a += x.dur; } return a; };
/** Narration settled = no line, a line that fits, or a fit chosen (D: narration-fit). */
const narrLen = s => s.narr ? (s.narr.voice === 'ready' ? s.narr.sec : s.narr.est) : 0;
const narrFits = s => !s.narr || s.narr.voice !== 'ready' ? null : (s.narr.sec <= s.dur + 1e-9 || !!s.narr.fit);
const lowerFirst = x => x.charAt(0).toLowerCase() + x.slice(1);

/* ---------------- pictures (flat SVG, 16:9; copied from last-ferry.html) ---------------- */
let uid = 0;
function pic(s){
  const u = 'g' + (++uid);
  const coat = s.coat === 'red' ? '#c8302c' : '#6e1f2b';
  const sky = (a, b) => `<defs><linearGradient id="${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="320" height="180" fill="url(#${u})"/>`;
  const fog = (y, o) => `<rect x="-10" y="${y}" width="340" height="9" rx="4" fill="#dfe7f0" opacity="${o}"/>`;
  let b = '';
  switch (s.art){
    case '1.1': b = `<rect width="320" height="180" fill="#1f1611"/><rect x="36" y="26" width="248" height="154" fill="#4a2e1f"/><rect x="70" y="40" width="180" height="20" rx="2" fill="#2b1b12"/>
      <text x="160" y="54.5" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#e9b871">TICKETS</text>
      <rect x="78" y="72" width="164" height="84" fill="#f0b866"/><rect x="78" y="72" width="164" height="44" fill="#6b4a33"/>
      ${[78,84,90,96,102,108,114].map(y => `<rect x="78" y="${y}" width="164" height="1.4" fill="#553826"/>`).join('')}
      <rect x="78" y="114" width="164" height="3" fill="#3a2518"/><rect x="96" y="132" width="128" height="24" fill="#c98b45"/>
      <circle cx="268" cy="70" r="46" fill="#ffcf7a" opacity=".12"/><circle cx="268" cy="70" r="22" fill="#ffcf7a" opacity=".18"/>
      <rect x="266" y="74" width="4" height="106" fill="#2b1b12"/><circle cx="268" cy="70" r="6" fill="#ffe3a8"/><rect y="166" width="320" height="14" fill="#24160f"/>`; break;
    case '1.2': b = `<rect width="320" height="180" fill="#3b2418"/>
      <rect x="190" y="18" width="110" height="88" fill="#f0b866" opacity=".9"/><rect x="190" y="18" width="110" height="88" fill="none" stroke="#2b1b12" stroke-width="4"/>
      <circle cx="248" cy="60" r="12" fill="#2b1b12"/><path d="M226 106 q22-36 44 0z" fill="#2b1b12"/>
      <circle cx="112" cy="62" r="15" fill="#d8a77f"/><path d="M96 58 q16-22 32 0 q-4-12-16-12 q-12 0-16 12z" fill="#2a1712"/>
      <path d="M78 180 L84 98 q28-14 56 0 L146 180z" fill="#b8322c"/><path d="M134 104 L196 118 L194 126 L130 116z" fill="#a52b26"/><circle cx="198" cy="121" r="6" fill="#d8a77f"/>
      <rect y="122" width="320" height="58" fill="#5c3a24"/><rect y="120" width="320" height="5" fill="#7a5032"/>
      <circle cx="214" cy="121" r="4" fill="#f2c25b"/><circle cx="226" cy="121" r="4" fill="#f2c25b"/><circle cx="238" cy="121.5" r="4" fill="#e3b04a"/>`; break;
    case '1.3': b = `<rect width="320" height="180" fill="#4a2e1f"/><circle cx="250" cy="20" r="60" fill="#ffcf7a" opacity=".1"/>
      <g transform="rotate(-6 160 110)"><rect x="70" y="78" width="180" height="76" rx="4" fill="#f1e3c4"/>
      <rect x="84" y="92" width="80" height="6" rx="2" fill="#b9a27a"/><rect x="84" y="104" width="60" height="5" rx="2" fill="#cdb995"/>

      <rect x="190" y="36" width="34" height="22" rx="4" fill="#2b1b12"/><rect x="200" y="8" width="14" height="30" rx="5" fill="#3b2418"/>

      ${fog(92, .32)}${fog(102, .22)}<path d="M176 100 H290 L280 118 H186z" fill="#26344a"/><rect x="200" y="86" width="64" height="15" fill="#34465f"/><rect x="226" y="72" width="10" height="15" fill="#26344a"/>
      ${[206,216,226,236,246,256].map(x => `<rect x="${x}" y="91" width="5" height="4" fill="#c9d4e2"/>`).join('')}
      <rect x="0" y="112" width="168" height="8" fill="#2f3d52"/>${[14,52,90,128,160].map(x => `<rect x="${x}" y="118" width="5" height="24" fill="#2a374a"/>`).join('')}
      <rect y="122" width="320" height="2" fill="#9fb2c8" opacity=".35"/><rect y="136" width="320" height="1.5" fill="#9fb2c8" opacity=".25"/>${fog(126, .18)}`; break;
    case '2.2': b = sky('#6a81a4', '#b3c2d4') + `<rect y="96" width="320" height="84" fill="#4c6282"/>${fog(90, .28)}
      <path d="M90 180 L136 98 H184 L230 180z" fill="#3a4a62"/><path d="M126 116 H194 M116 134 H204 M104 156 H216" stroke="#2c394d" stroke-width="2"/>
      <rect x="150" y="140" width="7" height="26" fill="#1f2633"/><rect x="163" y="140" width="7" height="26" fill="#1f2633"/>
      <path d="M146 82 H174 L184 146 H136z" fill="${coat}"/><path d="M172 88 L188 116 L183 119 L168 96z" fill="${coat}"/><rect x="183" y="112" width="10" height="7" rx="1" fill="#eef2f6" transform="rotate(-12 188 115)"/>
      <circle cx="160" cy="70" r="11" fill="#c9b3a6"/><path d="M149 68 q11-16 22 0 q-2-9-11-9 q-9 0-11 9z" fill="#2a2a33"/>
      <ellipse cx="180" cy="66" rx="9" ry="5" fill="#eef3f8" opacity=".35"/><ellipse cx="190" cy="62" rx="6" ry="3.5" fill="#eef3f8" opacity=".22"/>`; break;
    case '2.3': b = `<rect width="320" height="180" fill="#56677e"/>${[0,30,60,90,120,150].map(y => `<rect y="${y}" width="320" height="1.5" fill="#4a5a70"/>`).join('')}
      <g transform="rotate(-4 160 90)"><rect x="42" y="34" width="236" height="112" rx="5" fill="#e3e8ee"/><path d="M86 34 V146" stroke="#9aa8b8" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="100" y="62" font-family="Inter,sans-serif" font-size="9" font-weight="600" letter-spacing="2" fill="#6b7a8e">HARBOUR FERRY</text>
      <text x="100" y="92" font-family="Inter,sans-serif" font-size="19" font-weight="700" fill="#22303f">SUNDAY 31 MARCH</text>
      <text x="100" y="112" font-family="Inter,sans-serif" font-size="9" font-weight="600" letter-spacing="1.5" fill="#6b7a8e">DEP 06:40 · SINGLE</text>
      <text x="64" y="96" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#22303f" transform="rotate(-90 64 92)">No 0418</text></g>
      <ellipse cx="262" cy="160" rx="44" ry="30" fill="#c6a997"/><ellipse cx="246" cy="146" rx="15" ry="10" fill="#dcc3b4"/><path d="M270 180 Q300 150 320 146 V180z" fill="${coat}"/>`; break;
    case '3.1': b = sky('#7287a6', '#c3cfdc') + `<rect y="100" width="320" height="80" fill="#566c8a"/>${fog(84, .35)}${fog(94, .3)}
      <path d="M140 100 H184 L180 107 H144z" fill="#3a4a62" opacity=".85"/><rect x="150" y="93" width="22" height="7" fill="#46586f" opacity=".85"/>
      <path d="M162 108 L110 150 M162 108 L214 150" stroke="#9fb2c8" stroke-width="1.5" opacity=".5"/>${fog(110, .25)}${fog(128, .18)}
      <rect y="160" width="320" height="20" fill="#2f3d52"/>${[30,90,150,210,270].map(x => `<rect x="${x}" y="156" width="5" height="24" fill="#26324a"/>`).join('')}`; break;
    case '3.2': b = sky('#6f86a8', '#bccad9') + `<rect y="92" width="320" height="88" fill="#4c6282"/>${fog(86, .3)}
      ${[30,48,62,80].map((x, i) => `<rect x="${x}" y="${78 - i % 2 * 6}" width="12" height="${14 + i % 2 * 6}" fill="#5b6f8c"/>`).join('')}<circle cx="44" cy="76" r="1.6" fill="#f3d9a0"/><circle cx="70" cy="74" r="1.6" fill="#f3d9a0"/>
      <path d="M170 180 L176 112 q30-14 60 0 L242 180z" fill="#c8302c"/><circle cx="206" cy="94" r="17" fill="#c9b3a6"/><path d="M188 90 q18-26 36 0 q-3-15-18-15 q-15 0-18 15z" fill="#2a2a33"/>
      <rect y="140" width="320" height="6" fill="#26324a"/><rect y="160" width="320" height="4" fill="#26324a"/>${[20,80,140,260,300].map(x => `<rect x="${x}" y="140" width="4" height="40" fill="#26324a"/>`).join('')}`; break;
    case 'ref': b = `<rect width="320" height="180" fill="#2a2f38"/><rect x="40" y="20" width="110" height="140" rx="4" fill="#d9d4cc"/><circle cx="95" cy="62" r="20" fill="#c9b3a6"/><path d="M75 58 q20-30 40 0 q-4-18-20-18 q-16 0-20 18z" fill="#2a2a33"/><path d="M62 160 L68 92 q27-12 54 0 L128 160z" fill="#c8302c"/>
      <rect x="170" y="20" width="110" height="64" rx="4" fill="#c8302c"/><rect x="170" y="96" width="52" height="64" rx="4" fill="#6e1423"/><rect x="228" y="96" width="52" height="64" rx="4" fill="#9d1b2e"/>`; break;
    case 'timetable': b = `<rect width="320" height="180" fill="#e7e2d6"/><rect x="24" y="18" width="272" height="22" fill="#22303f"/><text x="160" y="33" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#e7e2d6">HARBOUR FERRY · WINTER</text>
      ${[0,1,2,3,4,5].map(i => `<rect x="24" y="${52 + i * 20}" width="272" height="1" fill="#b9b2a2"/><rect x="34" y="${58 + i * 20}" width="40" height="7" rx="2" fill="#8a8170"/><rect x="96" y="${58 + i * 20}" width="${80 + (i * 37) % 90}" height="7" rx="2" fill="#a59c89"/>`).join('')}
      <rect x="20" y="140" width="280" height="22" fill="none" stroke="#b8322c" stroke-width="2.5" transform="rotate(-1 160 150)"/>`; break;
  }
  return `<svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${esc(t('Picture', '画面'))} ${esc(s.label || s.art)}">${b}</svg>`;
}
/** A deterministic waveform for audio tiles and lanes. */
function wave(seed, n){
  let x = 0; for (const c of String(seed)) x = (x * 31 + c.charCodeAt(0)) % 997;
  let h = '';
  for (let i = 0; i < n; i++){ x = (x * 73 + 41) % 997; h += `<i style="height:${18 + (x % 70)}%"></i>`; }
  return `<div class="wave" aria-hidden="true">${h}</div>`;
}
/** Motion preview by keyword (D17): push-in, pull-back, pan, tilt, breath. */
function motionTransform(motion, p){
  const m = motion.toLowerCase();
  if (m.includes('push')) return `scale(${1 + .12 * p})`;
  if (m.includes('pull')) return `scale(${1.12 - .12 * p})`;
  if (m.includes('pan right')) return `scale(1.1) translateX(${4 - 8 * p}%)`;
  if (m.includes('pan left')) return `scale(1.1) translateX(${-4 + 8 * p}%)`;
  if (m.includes('tilt down')) return `scale(1.1) translateY(${4 - 8 * p}%)`;
  if (m.includes('breath')) return `scale(${1.012 + .01 * Math.sin(p * Math.PI * 4)})`;
  return 'none';
}

const IC = { fail: '<i class="ic" aria-hidden="true">!</i>', ask: '<i class="ic" aria-hidden="true">?</i>' };
function kfStatus(s){

  }
  if (s.kf === 'making') return `<span class="status busy">${t('Making keyframe…', '正在生成关键帧…')}</span>`;
  if (s.kf === 'none') return `<span class="status">${t('No keyframe yet', '还没有关键帧')}</span>`;
  if (s.kf === 'direction') return `<span class="status">${t('Needs direction first', '需要先写好画面描述')}</span>`;
  if (s.kf === 'outdated') return `<span class="status">${t('Keyframe out of date', '关键帧已过期')}</span>`;

function clipStatus(s){
  if (s.fail && s.fail.slot === 'clip'){
    if (s.fail.kind === 'no_answer') return `<span class="status fail">${IC.ask}${t('No answer from the service', '服务没有回应')}</span>`;
    return `<span class="status fail">${IC.fail}${s.fail.charged ? t('Clip failed · counted as spent', '视频失败 · 已计费') : t('Clip failed · not charged', '视频失败 · 未计费')}</span>`;
  }
  if (s.clip === 'ready') return `<span class="status ok">✓ ${t('Clip', '视频')}</span>`;
  if (s.clip === 'outdated') return `<span class="status">${t('Clip out of date', '视频已过期')}</span>`;

/** Guards: [data-needs="server"] needs the studio; [data-needs="run"] also starts work, so Stop turns it off. */
function guard(root){
  (root || document).querySelectorAll('[data-needs]').forEach(el => {
    const need = el.dataset.needs;
    let why = '';
    if (blocked()) why = t('Can’t reach the studio. This works again once it’s back.', '连不上工作室，恢复连接后可用。');
    else if (need === 'run' && Shell.stopped) why = t('Stopped. Continue first.', '已停止，请先继续。');
    if (why){ el.disabled = true; el.setAttribute('title', why); el.dataset.guarded = '1'; }
    else if (el.dataset.guarded){ el.removeAttribute('title'); delete el.dataset.guarded; if (!el.dataset.off) el.disabled = false; }
  });
}

/* ---------------- dialogs (native <dialog>; focus returns to the opener) ---------------- */
function openDialog(html, cls){
  const opener = document.activeElement;
  const d = document.createElement('dialog');
  d.className = cls || 'dialog';
  d.innerHTML = html;
  document.body.appendChild(d);
  d.addEventListener('close', () => { d.remove(); if (opener && opener.isConnected) opener.focus({ preventScroll: true }); else { const w = $('view'); if (w) w.focus && w.focus(); } });
  d.showModal();
  const f = d.querySelector('[autofocus]') || d.querySelector('input,textarea,select,button:not([disabled])');
  if (f) f.focus();
  return d;
}
/** A small action menu under its button; Esc or an outside click closes it and focus returns. */
function openMenu(btn, html){
  closeMenu(false);
  const m = document.createElement('div');
  m.className = 'menu'; m.id = 'ctx-menu'; m.setAttribute('role', 'menu');
  m.innerHTML = html;
  m.style.position = 'fixed'; m.style.visibility = 'hidden';
  document.body.appendChild(m);
  const r = btn.getBoundingClientRect();
  const left = Math.max(8, Math.min(r.right - m.offsetWidth, window.innerWidth - m.offsetWidth - 8));
  const top = r.bottom + 4 + m.offsetHeight > window.innerHeight - 8 ? r.top - 4 - m.offsetHeight : r.bottom + 4;
  m.style.left = left + 'px'; m.style.top = Math.max(8, top) + 'px'; m.style.visibility = '';
  Shell.menuOpener = btn; btn.setAttribute('aria-expanded', 'true');
  const f = m.querySelector('button:not([disabled]),a'); f && f.focus();
}
function closeMenu(refocus){
  const m = $('ctx-menu'); if (!m) return;
  m.remove();
  const o = Shell.menuOpener; Shell.menuOpener = null;
  if (o && o.isConnected){ o.setAttribute('aria-expanded', 'false'); if (refocus !== false) o.focus({ preventScroll: true }); }
}

function send(){

}
let impDlg = null;
function openImport(){ impDlg = openDialog(importHTML(), 'sheet'); impDlg.setAttribute('aria-labelledby', 'imp-h'); impDlg.addEventListener('close', () => { impDlg = null; IMP.file = null; }); guard(impDlg); }
function reImport(focusSel){ if (!impDlg) return; impDlg.innerHTML = importHTML(); guard(impDlg); const f = impDlg.querySelector(focusSel); f && f.focus(); }

const PAGE = {
  view: 'Assets', workClass: 'assets-work',
  scope: () => t('Assets', '素材'),
  states: [
    { id: 'film', label: 'The Last Ferry' },
    { id: 'selected', label: 'A voice line selected (earlier take)' },
    { id: 'exports', label: 'Exports filter (none yet)' },
    { id: 'import', label: 'Import a file' },
    { id: 'demo', label: 'Demo film (sources say Demo)' }
  ],
  state: 'film',
  onState(id){
    document.querySelectorAll('dialog[open]').forEach(d => d.close());
    V.items = baseItems(); V.role = 'all'; V.scene = 'all'; V.sel = null; FILM.demo = false;
    if (id === 'selected'){ V.sel = V.items.find(a => a.role === 'voice' && !a.current).id; setTimeout(() => { const b = document.querySelector('.tile[aria-pressed="true"]'); b && b.scrollIntoView({ block: 'center' }); }, 0); }
    if (id === 'exports') V.role = 'export';
    if (id === 'import') setTimeout(openImport, 0);
    if (id === 'demo'){ FILM.demo = true; V.items = V.items.filter(a => a.role !== 'upload' && a.label !== 'foghorn-theme.wav'); V.items.forEach(a => { a.source = 'demo'; }); V.items[0].label = 'demo-score.mp3'; }
  },
  render,
  openShot(id){ V.scene = 'all'; V.role = 'all'; render(); const el = $('set-' + id); if (el){ el.scrollIntoView({ block: 'center', behavior: reduceMotion() ? 'auto' : 'smooth' }); el.style.outline = '2px solid var(--select)'; el.style.outlineOffset = '-2px'; setTimeout(() => { el.style.outline = ''; }, 1600); } },
  pickerExtra(){ const a = V.items.find(x => x.id === V.sel); return a ? `<h4>${t('Selected asset', '选中的素材')}</h4><button data-act="sh-pick" data-ref="${esc(labelFor(a))}">${esc(labelFor(a))}<span>${t(ROLE[a.role][0], ROLE[a.role][1])}</span></button>` : ''; },
  act(a, el){
    switch (a){
      case 'role': V.role = el.dataset.v; render(); { const b = document.querySelector(`[data-act="role"][data-v="${V.role}"]`); b && b.focus(); } return;
      case 'clear': V.role = 'all'; V.scene = 'all'; return render();
      case 'sel': return select(el.dataset.id);
      case 'd-play': return playDetail();
      case 'download': { const it = V.items.find(x => x.id === el.dataset.id); return toast(t(`In the studio this downloads ${labelFor(it)}. This prototype has no file.`, `在工作室里这会下载 ${labelFor(it)}。原型里没有文件。`)); }
      case 'point': document.querySelectorAll('dialog[open]').forEach(d => d.close()); return pointAt(el.dataset.ref);
      case 'import': return openImport();
      case 'imp-file': IMP.file = el.dataset.v; IMP.as = 'music'; return reImport(`[data-act="imp-file"][data-v="${IMP.file}"]`);
      case 'imp-as': IMP.as = el.dataset.v; return reImport(`[data-act="imp-as"][data-v="${IMP.as}"]`);
      case 'imp-go': {
        const f = FILES.find(x => x.name === IMP.file); if (!f) return;
        const role = f.kind === 'audio' ? (IMP.as === 'music' ? 'music' : 'upload') : 'upload';
        const it = A(role, f.kind, { label: f.name, source: 'imported', createdAt: '11:02', dur: f.dur, art: f.kind === 'audio' ? undefined : f.art, current: false });
        V.items.splice(0, 0, it); V.role = 'all'; V.scene = 'all';
        impDlg && impDlg.close();
        V.sel = it.id; render();
        return toast(t(`Imported ${f.name} as ${role === 'music' ? 'music' : 'an upload'}.`, `已导入 ${f.name}，用作${role === 'music' ? '音乐' : '上传素材'}。`));
      }
    }
  }
};
document.addEventListener('change', e => { if (e.target.id === 'scene-f'){ V.scene = e.target.value; render(); $('scene-f').focus(); } });
mount(PAGE);
if (location.hash === '#exports'){ V.role = 'export'; PAGE.state = 'exports'; renderAll(); }
if (location.hash === '#import'){ PAGE.state = 'import'; renderAll(); openImport(); }
window.LastFerryAssets = { V, PAGE };
})();
</script>
</body>
</html>
